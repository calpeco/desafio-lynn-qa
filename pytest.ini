[pytest]
# Base da pirâmide: testes unitários (pytest). API e UI ficam em test/features (behave/Cucumber).
# Segurança: pytest test/sec (suíte própria, fora da contagem da pirâmide).
# app/ (lynn_mock) e test/ (qa_support) entram no sys.path para imports diretos.
pythonpath = app test
testpaths = test/unit
addopts = -ra --strict-markers
markers =
    trace(*tags): regras (ex.: CONV-RN04) e riscos (ex.: R09) cobertos pelo teste
    owasp(*ids): categorias OWASP cobertas (ex.: API1:2023, LLM01:2025)
